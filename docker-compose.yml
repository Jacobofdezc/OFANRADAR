version: '3.8'

services:
  web:
    build: .
    container_name: ofanradar_web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://radar_user:radar_password@postgres:5432/radar_db
      - ENVIRONMENT=production
      - JWT_SECRET=radar-prod-super-secret-key-2026
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: ofanradar_postgres
    environment:
      - POSTGRES_USER=radar_user
      - POSTGRES_PASSWORD=radar_password
      - POSTGRES_DB=radar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
